<!doctype html>
<html lang="en" data-standalone="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strata">
<meta name="theme-color" content="#121418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Strata Paint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@400;700&family=DM+Serif+Display&family=Inter:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;700;900&family=Space+Grotesk:wght@400;700&family=Syne:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen studio. Top bar, full-bleed canvas stage with left-edge sliders, tool dock at the bottom, bottom sheets for options. Deliberately dark-only so colours read true. */
:root{
  --ink:#121418; --work:#0b0d10; --panel:#1b1e24; --panel2:#252931; --line:#343a45;
  --text:#eceef2; --mute:#979dab; --accent:#f0b43c; --accent-ink:#241803; --danger:#ff7676;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font:14px/1.35 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;position:relative}
.screen{height:100%;display:flex;flex-direction:column}

/* ---------- Gallery ---------- */
#gallery{overflow:auto;-webkit-overflow-scrolling:touch}
.ghead{display:flex;align-items:center;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;background:var(--ink);z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.01em;flex:1}
.logo{width:26px;height:26px;border-radius:7px;background:
  linear-gradient(var(--accent),var(--accent)) 0 0/100% 30% no-repeat,
  linear-gradient(#e86f4f,#e86f4f) 0 50%/100% 30% no-repeat,
  linear-gradient(#5d8cf0,#5d8cf0) 0 100%/100% 30% no-repeat}
.pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:9px 16px;font-weight:600}
.pill.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .thumb{aspect-ratio:1;max-width:100%;background:
  repeating-conic-gradient(#2a2e36 0 25%,#22252c 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;border:0;padding:0;width:100%}
.card .thumb img{max-width:100%;max-height:100%;display:block}
.card .meta{padding:8px 10px;display:flex;gap:6px;align-items:center}
.card .meta div{flex:1;min-width:0}
.card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dm{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.card .more{border:0;background:none;padding:6px;border-radius:8px;color:var(--mute)}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.card .acts button{font-size:12px;padding:6px 10px}
.gfoot{color:var(--mute);font-size:12px;padding:0 max(16px,env(safe-area-inset-left,0px)) 24px}
.notice{margin:0 16px 8px;padding:10px 12px;border-radius:10px;background:var(--panel2);color:var(--mute);font-size:13px}

/* ---------- Editor ---------- */
#top{display:flex;align-items:center;gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));background:var(--ink);border-bottom:1px solid var(--line);z-index:5}
.ib{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:10px;color:var(--text);flex:none}
.ib:active{background:var(--panel2)}
.ib[disabled]{opacity:.35}
.ib.on{background:var(--panel2);color:var(--accent)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.docname{font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:30vw;padding-left:4px}
.spacer{flex:1}
.colordot{width:32px;height:32px;border-radius:50%;border:2px solid var(--text);margin:0 4px 0 6px;flex:none;box-shadow:0 0 0 2px var(--ink) inset}
#stage{position:relative;flex:1;overflow:hidden;background:var(--work);touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#sliders{position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.modbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);display:grid;place-items:center;padding:0;color:var(--text)}
.modbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#dropDot{position:fixed;width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.5);transform:translate(-50%,-85%);pointer-events:none;z-index:40}
.vs{width:30px;height:150px;border-radius:15px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);position:relative;touch-action:none;overflow:hidden}
.vs .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.vs .knob{position:absolute;left:4px;right:4px;height:8px;border-radius:4px;background:var(--text);transform:translateY(50%)}
.vs .lbl{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--mute);pointer-events:none}
#bubble{position:absolute;left:calc(max(6px,env(safe-area-inset-left,0px)) + 40px);top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-variant-numeric:tabular-nums;font-weight:600;z-index:4;pointer-events:none}
#zoom{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;z-index:4;pointer-events:none}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--ink);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;z-index:9;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#dock{display:flex;justify-content:space-around;align-items:center;gap:2px;padding:6px max(6px,env(safe-area-inset-right,0px)) 8px max(6px,env(safe-area-inset-left,0px));background:var(--ink);border-top:1px solid var(--line);z-index:5}
#dock .ib{width:42px;height:42px}
#dock .ib.on{background:var(--accent);color:var(--accent-ink)}
#xbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:4;width:max-content;max-width:calc(100% - 20px)}
#xbar button{border:0;background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600}
#xbar button.accent{background:var(--accent);color:var(--accent-ink)}
#xbar .hint{width:100%;text-align:center;color:var(--mute);font-size:11px;padding:2px 0 0}

/* ---------- Sheets ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:68%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;z-index:6;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
#sheetBody{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.sh h3{margin:0;font-size:16px;flex:1}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 8px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{flex:none;width:86px;color:var(--mute);font-size:13px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row output{width:46px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px;flex:1}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--text)}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:11px 12px;text-align:left;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.btn small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent;justify-content:center}
.btn.danger{color:var(--danger)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
select,input[type=text],input[type=number],textarea{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical;font-size:16px;-webkit-user-select:text;user-select:text}
input[type=text],input[type=number]{font-size:16px;-webkit-user-select:text;user-select:text}

.brushes{display:grid;gap:8px}
.brushrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:6px 10px;text-align:left}
.brushrow.on{border-color:var(--accent)}
.brushrow canvas{width:130px;height:34px;flex:none;border-radius:6px;background:var(--ink)}
.brushrow .bn{flex:1;min-width:0}
.brushrow .pill{padding:6px 12px;font-size:12px;flex:none}
.cats{margin:0 -4px;padding:0 4px 2px}
.stprev{width:100%;height:auto;aspect-ratio:640/190;border-radius:12px;display:block;margin-bottom:6px}
.pill[disabled]{opacity:.4}
.newcard{align-items:center;justify-content:center;gap:6px;min-height:200px;border-style:dashed;color:var(--mute);background:transparent}
.newcard span{font-size:40px;font-weight:300;line-height:1;color:var(--accent)}
.brushrow b{display:block;font-size:13px}
.brushrow span{color:var(--mute);font-size:11px}

.layers{display:flex;flex-direction:column;gap:6px}
.layer{border:1px solid var(--line);background:var(--panel2);border-radius:11px;overflow:hidden}
.layer.on{border-color:var(--accent)}
.lmain{display:flex;align-items:center;gap:10px;padding:6px 8px;width:100%;border:0;background:none;text-align:left}
.lthumb{width:44px;height:44px;border-radius:6px;flex:none;background:repeating-conic-gradient(#3a3f49 0 25%,#2c3038 0 50%) 0 0/10px 10px;object-fit:contain}
.lname{flex:1;min-width:0}
.lname b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.lname span{color:var(--mute);font-size:11px}
.eye{width:34px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--text)}
.eye.off{color:var(--mute);opacity:.6}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lopts{padding:4px 10px 10px;border-top:1px solid var(--line)}
.lopts .mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lopts .mini button{border:1px solid var(--line);background:var(--ink);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600}
.lopts .mini button.on{border-color:var(--accent);color:var(--accent)}
.lopts .mini button.danger{color:var(--danger)}

.sv{position:relative;width:100%;height:180px;border-radius:12px;overflow:hidden;touch-action:none}
.sv canvas{width:100%;height:100%;display:block}
.hue{position:relative;height:28px;border-radius:14px;margin-top:12px;touch-action:none;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.ring{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.hue .ring{top:50%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.15);padding:0;position:relative}
.sw.add{background:var(--panel2);display:grid;place-items:center;font-size:20px;color:var(--mute)}
.sw.rm::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:8px}
.hexrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.hexrow input{flex:1;text-transform:uppercase;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:12px}

/* ---------- Modal ---------- */
#modal{position:absolute;inset:0;z-index:20;background:rgba(6,7,9,.86);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:560px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0;font-size:17px}
.mbox p{margin:0;color:var(--mute);font-size:13px}
.mimg{max-width:100%;max-height:52vh;object-fit:contain;border-radius:10px;align-self:center;background:repeating-conic-gradient(#2a2e36 0 25%,#22252c 0 50%) 0 0/16px 16px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.mact{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}
.chip.on{background:var(--text);color:var(--ink);border-color:transparent}
.chip.dot{width:30px;height:30px;padding:0}
.chip.dot.on{outline:2px solid var(--accent);outline-offset:2px}
.mock canvas{width:100%;height:auto;border-radius:12px;display:block;max-height:50vh;object-fit:contain}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.preset{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;text-align:left}
.preset.on{border-color:var(--accent)}
.preset b{display:block;font-size:13px}
.preset span{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.wh{display:flex;gap:8px;align-items:center}
.wh input{width:100%}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<div id="app">
  <section id="gallery" class="screen">
    <header class="ghead">
      <div class="brand"><span class="logo" aria-hidden="true"></span>Strata</div>
      <button id="newBtn" class="pill accent">New canvas</button>
    </header>
    <div id="gnotice" class="notice" hidden></div>
    <div id="grid" class="grid"></div>
    <p class="gfoot">Canvases are saved in this browser on this device. Export finished work to Photos so you never lose it.</p>
  </section>

  <section id="editor" class="screen" hidden>
    <header id="top">
      <button class="ib" id="bGallery" aria-label="Back to gallery"></button>
      <div id="docName" class="docname"></div>
      <div class="spacer"></div>
      <button class="ib" id="bUndo" aria-label="Undo"></button>
      <button class="ib" id="bRedo" aria-label="Redo"></button>
      <button class="ib" id="bActions" aria-label="Actions"></button>
      <button class="ib" id="bAdjust" aria-label="Adjustments"></button>
      <button class="ib" id="bLayers" aria-label="Layers"></button>
      <button id="bColor" class="colordot" aria-label="Colour"></button>
    </header>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="sliders">
        <div class="vs" id="vsSize" aria-label="Brush size"><div class="fill"></div><div class="knob"></div><div class="lbl">SIZE</div></div>
        <button class="modbtn" id="bPick" aria-label="Eyedropper: tap, then touch the canvas"></button>
        <div class="vs" id="vsOpa" aria-label="Opacity"><div class="fill"></div><div class="knob"></div><div class="lbl">OPAC</div></div>
      </div>
      <div id="bubble" hidden></div>
      <div id="zoom" hidden></div>
      <div id="toast" hidden></div>
      <div id="xbar" hidden></div>
      <div id="sheet" hidden><div class="grab"></div><div id="sheetBody"></div></div>
    </div>
    <nav id="dock"></nav>
  </section>
  <div id="modal" hidden></div>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
(()=>{
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TAU=Math.PI*2;

const ICON={
 back:'<path d="M15 18l-6-6 6-6"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
 redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/>',
 actions:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
 adjust:'<path d="M15 4V2M15 10V8M11 6H9M21 6h-2M18 3l-1 1M18 9l-1-1M3 21l11-11"/>',
 layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".5"/>',

function hsvToRgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return [f(5)*255,f(3)*255,f(1)*255];}

function editPixels(L,r,fn,dropText=true){r=r||fullRect();const before=grab(L,r);const tb=L.text;fn();const after=grab(L,r);const ta=dropText?null:L.text;if(dropText)L.text=null;pushOp(pixelOp(L,r,before,after,tb,ta));}

  for(const L of d.layers){if(!L.visible)continue;
    if(live&&L===d.active&&stroke&&!stroke.direct&&stroke.mode==='source-over'&&L.blend==='source-over'&&L.opacity===1){c.globalAlpha=1;c.globalCompositeOperation='source-over';c.drawImage(L.canvas,0,0);c.globalAlpha=stroke.opacity;c.drawImage(strokeSrc(stroke),0,0);continue;}
    let src=L.canvas;if(live&&L===d.active)src=liveLayer(L)||src;c.globalAlpha=L.opacity;c.globalCompositeOperation=L.blend;c.drawImage(src,0,0);}

  let lay=null;if(direct){const c=mk(w,h);lay={canvas:c,ctx:c.getContext('2d')};[['#e8574a',.3],['#f2c14e',.5],['#3f7fd9',.7]].forEach(([cl,t])=>{lay.ctx.fillStyle=cl;lay.ctx.fillRect(w*t-w*.07,h*.12,w*.14,h*.76);});}

/* ============ shapes ============ */
let shapeDraft=null;

    case 'round':rr(c,x,y,w,h,Math.min(w,h)*.2);break;
    case 'ellipse':c.ellipse(cx,cy,w/2,h/2,0,0,TAU);break;
    case 'line':{let ex=x1,ey=y1;if(S.shape.square){const a=Math.round(Math.atan2(y1-y0,x1-x0)/(Math.PI/4))*(Math.PI/4),d=Math.hypot(x1-x0,y1-y0);ex=x0+Math.cos(a)*d;ey=y0+Math.sin(a)*d;}c.moveTo(x0,y0);c.lineTo(ex,ey);break;}

/* ============ fill ============ */
function floodFill(px,py){

  const match=i=>{const k=i*4;return Math.abs(ref[k]-tr)<=tol&&Math.abs(ref[k+1]-tg)<=tol&&Math.abs(ref[k+2]-tb)<=tol&&Math.abs(ref[k+3]-ta)<=tol;};

      if(y>0){const m=!mask[row-W+x]&&match(row-W+x);if(m&&!up){stack.push(x,y-1);up=true;}else if(!m)up=false;}
      if(y<H-1){const m=!mask[row+W+x]&&match(row+W+x);if(m&&!dn){stack.push(x,y+1);dn=true;}else if(!m)dn=false;}
      x++;}
    if(y<miny)miny=y;if(y>maxy)maxy=y;}
  const r=clipRect([minx-2,miny-2,maxx+3,maxy+3]);if(!r)return;
  const [cr,cg,cb]=hexToRgb(S.color),ca=S.opacity.brush;
  editPixels(L,r,()=>{const img=L.ctx.getImageData(r[0],r[1],r[2],r[3]);const d=img.data;
    for(let y=0;y<r[3];y++)for(let x=0;x<r[2];x++){const gx=x+r[0],gy=y+r[1];let hit=mask[gy*W+gx];

}

/* ============ eyedropper ============ */

/* ============ transform (move tool) ============ */

  const bb=contentBounds(L.canvas);if(!bb){toast('This layer is empty');return;}
  const src=mk(W,H);src.getContext('2d').drawImage(L.canvas,0,0);

}
function drawXformed(c){const t=xform;c.save();c.translate(t.cx+t.dx,t.cy+t.dy);c.rotate(t.rot);c.scale(t.scale*t.fx,t.scale*t.fy);c.translate(-t.cx,-t.cy);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(t.src,0,0);c.restore();}

function showXbar(){const x=$('#xbar');x.hidden=false;x.innerHTML=`<button data-x="fh">Flip ↔</button><button data-x="fv">Flip ↕</button><button data-x="r90">Rotate 90°</button><button data-x="fit">Fit</button><button data-x="center">Centre</button><button data-x="reset">Reset</button><button data-x="done" class="accent">Done</button><div class="hint">Drag to move · pinch with two fingers to scale and rotate</div>`;}

$('#xbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!xform)return;const t=xform;const k=b.dataset.x;
  if(k==='fh')t.fx*=-1;else if(k==='fv')t.fy*=-1;else if(k==='r90')t.rot=Math.round((t.rot+Math.PI/2)/(Math.PI/2))*(Math.PI/2);

/* ============ text ============ */
const fontStr=t=>`${t.weight} ${t.size}px "${t.font}", sans-serif`;

function adjPreview(){if(!adj)return;const a=adj;const out=new ImageData(new Uint8ClampedArray(a.src.data),W,H);
  if(a.blur>0)boxBlur(out,a.blur);
  if(a.hue||a.sat||a.bri||a.con){const m=colorMatrix(a.hue,a.sat);const d=out.data,br=a.bri*2.55,cf=(259*(a.con*2.55+255))/(255*(259-a.con*2.55));
    for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const r=d[i],g=d[i+1],b=d[i+2];let nr=m[0]*r+m[1]*g+m[2]*b,ng=m[3]*r+m[4]*g+m[5]*b,nb=m[6]*r+m[7]*g+m[8]*b;
      nr=cf*(nr-128)+128+br;ng=cf*(ng-128)+128+br;nb=cf*(nb-128)+128+br;d[i]=nr;d[i+1]=ng;d[i+2]=nb;}}
  a.L.ctx.putImageData(out,0,0);a.changed=true;requestRender();}
function colorMatrix(hueDeg,satPct){const h=hueDeg*Math.PI/180,c=Math.cos(h),s=Math.sin(h);
  let m=[.213+c*.787-s*.213,.715-c*.715-s*.715,.072-c*.072+s*.928,.213-c*.213+s*.143,.715+c*.285+s*.14,.072-c*.072-s*.283,.213-c*.213-s*.787,.715-c*.715+s*.715,.072+c*.928+s*.072];
  const t=1+satPct/100;const sm=[.213+.787*t,.715-.715*t,.072-.072*t,.213-.213*t,.715+.285*t,.072-.072*t,.213-.213*t,.715-.715*t,.072+.928*t];
  const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){r[i*3+j]=sm[i*3]*m[j]+sm[i*3+1]*m[3+j]+sm[i*3+2]*m[6+j];}return r;}
function boxBlur(img,radius){const w=img.width,h=img.height,d=img.data,n=w*h;const a=new Float32Array(n*4),t=new Float32Array(n*4);
  for(let i=0;i<n;i++){const k=i*4,al=d[k+3]/255;a[k]=d[k]*al;a[k+1]=d[k+1]*al;a[k+2]=d[k+2]*al;a[k+3]=d[k+3];}
  const r=Math.max(1,Math.round(radius/1.7));
  for(let p=0;p<3;p++){blurH(a,t,w,h,r);blurV(t,a,w,h,r);}
  for(let i=0;i<n;i++){const k=i*4,al=a[k+3]/255;d[k+3]=a[k+3];if(al>0){d[k]=a[k]/al;d[k+1]=a[k+1]/al;d[k+2]=a[k+2]/al;}}}
function blurH(s,t,w,h,r){const k=1/(r+r+1);for(let y=0;y<h;y++){const row=y*w*4;for(let c=0;c<4;c++){let sum=0;for(let i=-r;i<=r;i++)sum+=s[row+clamp(i,0,w-1)*4+c];for(let x=0;x<w;x++){t[row+x*4+c]=sum*k;sum+=s[row+Math.min(w-1,x+r+1)*4+c]-s[row+Math.max(0,x-r)*4+c];}}}}
function blurV(s,t,w,h,r){const k=1/(r+r+1);for(let x=0;x<w;x++){for(let c=0;c<4;c++){let sum=0;for(let i=-r;i<=r;i++)sum+=s[clamp(i,0,h-1)*w*4+x*4+c];for(let y=0;y<h;y++){t[y*w*4+x*4+c]=sum*k;sum+=s[Math.min(h-1,y+r+1)*w*4+x*4+c]-s[Math.max(0,y-r)*w*4+x*4+c];}}}}
function adjEnd(keep){if(!adj)return;const a=adj;adj=null;if(!a.changed)return;if(!keep){a.L.ctx.putImageData(a.src,0,0);requestRender();return;}
  const after=grab(a.L,fullRect());a.L.text=null;pushOp(pixelOp(a.L,fullRect(),a.src,after,a.tb,null));}
function quickAdjust(kind){const L=active();if(!L)return;adjEnd(true);
  editPixels(L,fullRect(),()=>{const c=L.ctx;
    if(kind==='recolor'){c.save();c.globalCompositeOperation='source-in';c.fillStyle=S.color;c.fillRect(0,0,W,H);c.restore();}
    else if(kind==='invert'||kind==='mono'){const img=c.getImageData(0,0,W,H),d=img.data;for(let i=0;i<d.length;i+=4){if(kind==='invert'){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}else{const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=v;}}c.putImageData(img,0,0);}
    else if(kind==='clear'){c.clearRect(0,0,W,H);}
    else if(kind==='flipH'||kind==='flipV'){const t=mk(W,H);t.getContext('2d').drawImage(L.canvas,0,0);c.save();c.clearRect(0,0,W,H);if(kind==='flipH'){c.translate(W,0);c.scale(-1,1);}else{c.translate(0,H);c.scale(1,-1);}c.drawImage(t,0,0);c.restore();}
  });
  toast({recolor:'Layer recoloured',invert:'Colours inverted',mono:'Made greyscale',clear:'Layer cleared',flipH:'Layer flipped',flipV:'Layer flipped'}[kind]);
}
function flipCanvas(){endSessions(true);const Ls=S.doc.layers;const befores=Ls.map(L=>grab(L,fullRect()));const tbs=Ls.map(L=>L.text);
  Ls.forEach(L=>{const t=mk(W,H);t.getContext('2d').drawImage(L.canvas,0,0);L.ctx.save();L.ctx.clearRect(0,0,W,H);L.ctx.translate(W,0);L.ctx.scale(-1,1);L.ctx.drawImage(t,0,0);L.ctx.restore();L.text=null;});
  const afters=Ls.map(L=>grab(L,fullRect()));pushOp({undo(){Ls.forEach((L,i)=>{L.ctx.putImageData(befores[i],0,0);L.text=tbs[i];});},redo(){Ls.forEach((L,i)=>{L.ctx.putImageData(afters[i],0,0);L.text=null;});}});toast('Canvas flipped');}

/* ============ layer actions ============ */
function addLayer(){endSessions(true);if(S.doc.layers.length>=maxLayers())return toast(`Layer limit reached (${maxLayers()} for this canvas size)`);
  structOp(()=>{const L=newLayer('Layer '+(S.doc.layers.length+1));const i=S.doc.layers.indexOf(active());S.doc.layers.splice(i+1,0,L);S.doc.active=L;});}
function dupLayer(L){endSessions(true);if(S.doc.layers.length>=maxLayers())return toast('Layer limit reached');
  structOp(()=>{const n=newLayer(L.name+' copy');n.ctx.drawImage(L.canvas,0,0);Object.assign(n,{opacity:L.opacity,blend:L.blend,alphaLock:L.alphaLock,visible:L.visible,text:L.text?{...L.text}:null});const i=S.doc.layers.indexOf(L);S.doc.layers.splice(i+1,0,n);S.doc.active=n;});}
function delLayer(L){endSessions(true);if(S.doc.layers.length<=1){return quickAdjust('clear');}
  structOp(()=>{const i=S.doc.layers.indexOf(L);S.doc.layers.splice(i,1);S.doc.active=S.doc.layers[Math.max(0,i-1)];});}
function moveLayer(L,dir){endSessions(true);const a=S.doc.layers,i=a.indexOf(L),j=i+dir;if(j<0||j>=a.length)return;structOp(()=>{a.splice(i,1);a.splice(j,0,L);});}
function mergeDown(L){endSessions(true);const a=S.doc.layers,i=a.indexOf(L);if(i<=0)return toast('Nothing below to merge into');const B=a[i-1];
  const sb=snap(),before=grab(B,fullRect()),tb=B.text;
  if(L.visible){B.ctx.save();B.ctx.globalAlpha=L.opacity;B.ctx.globalCompositeOperation=L.blend;B.ctx.drawImage(L.canvas,0,0);B.ctx.restore();}
  a.splice(i,1);S.doc.active=B;B.text=null;const after=grab(B,fullRect()),sa=snap();
  pushOp({undo(){B.ctx.putImageData(before,0,0);restore(sb);B.text=tb;},redo(){B.ctx.putImageData(after,0,0);restore(sa);B.text=null;}});toast('Merged down');}
function setLayerProp(L,k,v){const b=snap();L[k]=v;const a=snap();pushOp({undo(){restore(b)},redo(){restore(a)}});}
async function importImage(file){
  endSessions(true);if(S.doc.layers.length>=maxLayers())return toast('Layer limit reached');
  let img;try{img=await createImageBitmap(file);}catch(e){img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);}).catch(()=>null);}
  if(!img)return toast("That file couldn't be opened as an image");
  structOp(()=>{const L=newLayer(file.name?file.name.replace(/\.[^.]+$/,'').slice(0,24):'Photo');const s=Math.min(W/img.width,H/img.height,1)*(img.width>W||img.height>H?.9:1);const w=img.width*s,h=img.height*s;
    L.ctx.imageSmoothingQuality='high';L.ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);const i=S.doc.layers.indexOf(active());S.doc.layers.splice(i+1,0,L);S.doc.active=L;});
  setTool('move');toast('Photo added · drag or pinch to place it');
}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importImage(f);});

/* ============ sessions ============ */
function endSessions(keep){if(stroke)strokeAbort();if(textSess){closeSheetSilently();textCommit();}if(adj){if(sheetName==='adjust')closeSheetSilently();adjEnd(keep);}if(xform){keep?xformApply():xformCancel();}}

/* ============ pointer input ============ */
const ptrs=new Map();let gesture=null,tap=null,blockUntilClear=false,acting=null;
function pt(e){const r=stage.getBoundingClientRect();return{sx:e.clientX-r.left,sy:e.clientY-r.top};}
function docPt(e){const {sx,sy}=pt(e);const d=toDoc(sx,sy);return{x:d.x,y:d.y,sx,sy,pressure:e.pressure,pen:e.pointerType==='pen',t:e.timeStamp||performance.now()};}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('#sheet,#sliders,#xbar'))return;
  if(sheetName){closeSheet();blockUntilClear=true;}
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
  const {sx,sy}=pt(e);ptrs.set(e.pointerId,{x:sx,y:sy,x0:sx,y0:sy});
  if(ptrs.size===1){tap={t:performance.now(),max:1,moved:false};if(blockUntilClear)return;toolDown(e);}
  else{if(tap)tap.max=Math.max(tap.max,ptrs.size);cancelTool();if(ptrs.size===2)startGesture();}
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const {sx,sy}=pt(e);p.x=sx;p.y=sy;
  if(tap&&Math.hypot(sx-p.x0,sy-p.y0)>10)tap.moved=true;
  if(gesture){updateGesture();return;}if(blockUntilClear||!acting)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ce of (evs.length?evs:[e]))toolMove(ce);
  if(stroke&&acting!=='picker')armQuickShape(sx,sy);
});
const up=e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(gesture){if(ptrs.size<2){gesture=null;blockUntilClear=true;$('#zoom').hidden=true;}}
  else if(acting&&!blockUntilClear){if(e.type==='pointercancel')cancelTool();else toolUp(e);}
  if(ptrs.size===0){if(tap&&!tap.moved&&tap.max>=2&&performance.now()-tap.t<320){tap.max===2?undo():redo();}tap=null;blockUntilClear=false;}
};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
['gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
stage.addEventListener('touchmove',e=>{if(!e.target.closest('#sheet'))e.preventDefault();},{passive:false});
stage.addEventListener('wheel',e=>{e.preventDefault();const {sx,sy}=pt(e);if(e.ctrlKey||e.metaKey){zoomAt(sx,sy,Math.exp(-e.deltaY*.01));}else{S.view.tx-=e.deltaX;S.view.ty-=e.deltaY;requestRender();}},{passive:false});
function zoomAt(sx,sy,f){const v=S.view,ns=clamp(v.scale*f,.03,40),k=ns/v.scale;v.tx=sx-(sx-v.tx)*k;v.ty=sy-(sy-v.ty)*k;v.scale=ns;showZoom();requestRender();}
function showZoom(){const z=$('#zoom');z.hidden=false;z.textContent=Math.round(S.view.scale*100)+'%';clearTimeout(showZoom.t);showZoom.t=setTimeout(()=>z.hidden=true,900);}
function startGesture(){const [a,b]=[...ptrs.values()];const v=S.view;gesture={d0:Math.hypot(b.x-a.x,b.y-a.y)||1,a0:Math.atan2(b.y-a.y,b.x-a.x),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},s0:v.scale,tx0:v.tx,ty0:v.ty,xf:(S.tool==='move'&&xform)?{...xform}:null};}
function updateGesture(){const vals=[...ptrs.values()];if(vals.length<2)return;const [a,b]=vals,g=gesture;const d=Math.hypot(b.x-a.x,b.y-a.y),ang=Math.atan2(b.y-a.y,b.x-a.x),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if(g.xf&&xform){xform.scale=clamp(g.xf.scale*d/g.d0,.02,50);let r=g.xf.rot+(ang-g.a0);const snapA=Math.round(r/(Math.PI/2))*(Math.PI/2);if(Math.abs(r-snapA)<.05)r=snapA;xform.rot=r;xform.dx=g.xf.dx+(m.x-g.m0.x)/S.view.scale;xform.dy=g.xf.dy+(m.y-g.m0.y)/S.view.scale;requestRender();return;}
  const ns=clamp(g.s0*d/g.d0,.03,40);const dx=(g.m0.x-g.tx0)/g.s0,dy=(g.m0.y-g.ty0)/g.s0;S.view.scale=ns;S.view.tx=m.x-dx*ns;S.view.ty=m.y-dy*ns;showZoom();requestRender();}

function toolDown(e){
  const p=docPt(e);acting=S.tool;qsAnchor=null;
  if(S.pickOnce){acting='picker';pickMove(p.sx,p.sy);return;}
  switch(S.tool){
    case 'brush':case 'eraser':case 'smudge':
      if(!strokeBegin(p)){acting=null;return;}
      break;
    case 'picker':pickMove(p.sx,p.sy);break;
    case 'shape':{const L=active();if(!L||!L.visible){toast(L?'This layer is hidden':'No layer');acting=null;return;}shapeDraft={k:S.shape.kind,x0:p.x,y0:p.y,x1:p.x,y1:p.y};break;}
    case 'move':xformBegin();if(!xform){acting=null;return;}acting={x:p.sx,y:p.sy,dx:xform.dx,dy:xform.dy};break;
    case 'fill':case 'text':break;
  }
}
function toolMove(e){
  const p=docPt(e);
  if(acting==='picker'){pickMove(p.sx,p.sy);return;}
  switch(S.tool){
    case 'brush':case 'eraser':case 'smudge':if(stroke)strokeAdd(stroke,p,false);break;
    case 'shape':if(shapeDraft){shapeDraft.x1=p.x;shapeDraft.y1=p.y;drawShapeDraft();}break;
    case 'move':if(xform&&acting&&acting.x!==undefined){xform.dx=acting.dx+(p.sx-acting.x)/S.view.scale;xform.dy=acting.dy+(p.sy-acting.y)/S.view.scale;requestRender();}break;
  }
}
function toolUp(e){
  clearTimeout(qsTimer);const p=docPt(e);const was=acting;acting=null;
  if(was==='picker'){pickEnd();if(S.pickOnce){S.pickOnce=false;$('#bPick').classList.remove('on');}return;}
  switch(S.tool){
    case 'brush':case 'eraser':case 'smudge':if(stroke){strokeAdd(stroke,p,false);strokeEnd();}break;
    case 'shape':if(shapeDraft){const d=shapeDraft;shapeDraft=null;if(Math.hypot(d.x1-d.x0,d.y1-d.y0)<2){stroke=null;sctx.clearRect(0,0,W,H);requestRender();break;}const L=stroke.L,box=stroke.box,mode=stroke.mode,op=stroke.opacity;stroke=null;const r=clipRect(box);if(r)editPixels(L,r,()=>{L.ctx.save();L.ctx.globalAlpha=op;L.ctx.globalCompositeOperation=mode;L.ctx.drawImage(strokeC,0,0);L.ctx.restore();});sctx.clearRect(0,0,W,H);}break;
    case 'fill':if(tap&&!tap.moved)floodFill(p.x,p.y);break;
    case 'text':if(tap&&!tap.moved)textTap(p);break;
  }
}
function cancelTool(){clearTimeout(qsTimer);if(acting==='picker'){loupe=null;}if(stroke)strokeAbort();shapeDraft=null;if(S.tool==='move'&&xform&&acting&&acting.x!==undefined){xform.dx=acting.dx;xform.dy=acting.dy;}acting=null;requestRender();}

/* ============ side sliders ============ */
let sizePreview=false;
const sizeKey=()=>['eraser','smudge'].includes(S.tool)?S.tool:'brush';
function sliderVal(k){const t=sizeKey();if(k==='size'){return Math.log(S.size[t])/Math.log(maxSize());}return S.opacity[t];}
function updateSliders(){for(const [id,k] of [['#vsSize','size'],['#vsOpa','opa']]){const el=$(id),v=clamp(sliderVal(k),0,1);el.querySelector('.fill').style.height=(v*100)+'%';el.querySelector('.knob').style.bottom=(v*100)+'%';}}
function bindSlider(id,k){const el=$(id);let on=false;
  const set=e=>{const r=el.getBoundingClientRect();const v=clamp(1-(e.clientY-r.top)/r.height,0,1);const t=sizeKey();
    if(k==='size'){S.size[t]=Math.max(1,Math.round(Math.pow(maxSize(),v)));bubble(S.size[t]+' px');sizePreview=true;}
    else{S.opacity[t]=Math.max(.01,Math.round(v*100)/100);bubble(Math.round(S.opacity[t]*100)+'%'+(t==='smudge'?' strength':''));}
    updateSliders();requestRender();};
  el.addEventListener('pointerdown',e=>{on=true;try{el.setPointerCapture(e.pointerId);}catch(_){}set(e);e.stopPropagation();});
  el.addEventListener('pointermove',e=>{if(on)set(e);});
  const off=()=>{on=false;sizePreview=false;$('#bubble').hidden=true;requestRender();};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);}
function bubble(t){const b=$('#bubble');b.hidden=false;b.textContent=t;}
bindSlider('#vsSize','size');bindSlider('#vsOpa','opa');

/* ============ toolbar ============ */
const TOOLS=[['brush','Brush'],['smudge','Smudge'],['eraser','Eraser'],['fill','Fill'],['shape','Shapes'],['text','Text'],['move','Move & transform'],['picker','Eyedropper']];
$('#dock').innerHTML=TOOLS.map(([k,n])=>`<button class="ib" data-tool="${k}" aria-label="${n}">${svg(k)}</button>`).join('');
$('#dock').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;const k=b.dataset.tool;
  if(k===S.tool){const sh={brush:'brushes',eraser:'brushes',smudge:'brushes',shape:'shape',fill:'fill'}[k];if(sh==='brushes'&&sheetName==='studio'){closeSheet();return;}if(sh)openSheet(sh);else if(k==='text')toast('Tap the canvas to add text');else if(k==='picker')toast('Touch and drag on the canvas to pick a colour');return;}
  setTool(k);});
function setTool(k){
  if(S.tool==='move'&&k!=='move')xformApply();

  if(k==='move')xformBegin();
  const hint={fill:'Tap an area to fill it',text:'Tap the canvas to place text',picker:'Drag on the canvas to pick a colour',shape:'Drag to draw · tap Shapes again for options'}[k];if(hint)toast(hint);
  if(sheetName&&['brushes','studio','shape','fill'].includes(sheetName))closeSheet();
}
['#bGallery','back','#bUndo','undo','#bRedo','redo','#bActions','actions','#bAdjust','adjust','#bLayers','layers'].reduce((a,v,i,arr)=>{if(i%2===0)$(v).innerHTML=svg(arr[i+1]);return a;},0);
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;

    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const d=toDoc(e.clientX-r.left,e.clientY-r.top+(-46*.35));endSessions(true);floodFill(d.x,d.y);toast('Filled with '+S.color.toUpperCase());}});
  btn.addEventListener('pointercancel',()=>{st=null;dot.hidden=true;});

/* ============ colour ============ */
function setColor(hex,fromPick){S.color=hex.toLowerCase();S.hsv=rgbToHsv(...hexToRgb(hex));$('#bColor').style.background=S.color;if(fromPick||!setColor.dragging)pushRecent(S.color);if(sheetName==='color')syncColorSheet();if(textSess&&textSess.L.text){textSess.L.text.color=S.color;renderText(textSess.L);requestRender();}}
function pushRecent(c){S.recents=[c,...S.recents.filter(x=>x!==c)].slice(0,12);store.set('strata.recents',S.recents);}

/* ============ sheets ============ */
let sheetName=null;
const sheet=$('#sheet'),body=$('#sheetBody');
function openSheet(n){if(sheetName===n){closeSheet();return;}if(sheetName&&['brushes','studio'].includes(sheetName)&&['brushes','studio'].includes(n)){sheetName=n;body.scrollTop=0;buildSheet();return;}closeSheet();sheetName=n;sheet.hidden=false;body.scrollTop=0;buildSheet();}
function closeSheet(){if(!sheetName)return;const n=sheetName;sheetName=null;sheet.hidden=true;body.innerHTML='';if(n==='text')textCommit();if(n==='adjust')adjEnd(true);}
function closeSheetSilently(){sheetName=null;sheet.hidden=true;body.innerHTML='';}
function buildSheet(){const f=SHEETS[sheetName];if(f){const st=body.scrollTop;body.innerHTML='';body.onclick=null;f(body);body.scrollTop=st;}}

const SHEETS={
 brushes(b){const t=S.tool;const sel=S.brushFor[t];const cur=brushById(sel);if(!CATS.some(c=>c[0]===S.brushCat))S.brushCat='ink';

  b.querySelectorAll('.brushrow').forEach(r=>{const c=r.querySelector('canvas');c.getContext('2d').drawImage(brushPreview(brushById(r.dataset.b),260,68),0,0);});
  b.onclick=e=>{const c=e.target.closest('[data-cat]');if(c){S.brushCat=c.dataset.cat;store.set('strata.cat',S.brushCat);buildSheet();return;}
   const r=e.target.closest('[data-b]');if(!r)return;if(e.target.closest('[data-edit]')||S.brushFor[t]===r.dataset.b){S.studioId=r.dataset.b;openSheet('studio');return;}
   S.brushFor[t]=r.dataset.b;buildSheet();toast(brushById(r.dataset.b).name);};},
 studio(b){const id=S.studioId||S.brushFor[sizeKey()];const br=brushById(id);const custom=customBrushes.find(x=>x.id===id);

   ['Shape',[['shape','Tip','sel',[['round','Round'],['soft','Soft'],['square','Square'],['chisel','Chisel'],['flat','Flat'],['charcoal','Charcoal'],['bristle','Bristles'],['spray','Spray'],['splatter','Splatter'],['hatch','Hatching'],['leaf','Leaf'],['star','Star'],['grass','Grass'],['fur','Fur'],['glow','Glow core']]],['aspect','Roundness',.05,1,.01,pct],['angle','Angle',-1.57,1.57,.01,v=>Math.round(v*180/Math.PI)+'°'],['follow','Turn with stroke','tog'],['jAngle','Rotation jitter',0,1,.01,pct]]],
   ['Grain',[['grain','Texture','sel',[['','None'],['paper','Paper'],['canvas','Canvas'],['charcoal','Charcoal'],['sponge','Sponge'],['noise','Noise']]],['grainScale','Scale',.25,4,.05,v=>v.toFixed(2)+'×'],['grainDepth','Depth',0,1,.01,pct]]],
   ['Pressure and speed',[['sizeP','Pressure → size',0,1,.01,pct],['opP','Pressure → opacity',0,1,.01,pct],['speedThin','Fast strokes thin out',0,1,.01,pct]]],
   ['Dynamics',[['flow','Flow',.01,1,.01,pct],['jSize','Size jitter',0,1,.01,pct],['jOpa','Opacity jitter',0,1,.01,pct],['jHue','Hue jitter',0,.5,.01,pct],['jBri','Brightness jitter',0,.5,.01,pct]]],

  ];
  const field=([k,l,a,c,d,fmt])=>{const v=br[k];if(a==='tog')return`<div class="row"><label style="flex:1;width:auto">${l}</label><div class="seg" style="flex:none;width:130px" data-tog="${k}"><button data-v="0" class="${v?'':'on'}">Off</button><button data-v="1" class="${v?'on':''}">On</button></div></div>`;

    return`<div class="row"><label for="st_${k}">${l}</label><input id="st_${k}" data-k="${k}" type="range" min="${a}" max="${c}" step="${d}" value="${v}"><output>${fmt(v)}</output></div>`;};
  b.innerHTML=`<div class="sh"><button class="pill" id="stBack">‹ Library</button><h3 style="text-align:center">Brush Studio</h3><button class="pill accent" id="stUse">Use</button></div>

   <div class="row">${custom?`<input type="text" id="stName" value="${esc(br.name)}" maxlength="30" style="flex:1" aria-label="Brush name">`:`<b style="flex:1">${esc(br.name)}</b>`}
    <button class="pill" id="stDup">Duplicate</button>${custom?'<button class="pill danger" id="stDel">Delete</button>':`<button class="pill" id="stReset" ${brushMods[id]?'':'disabled'}>Reset</button>`}</div>
   ${F.map(([h,fs])=>`<div class="sec">${h}</div>${fs.map(field).join('')}`).join('')}
   <p class="empty" style="margin-top:12px">Changes save automatically on this device. Wet mix only works with the Brush tool.</p>`;
  const draw=()=>{const c=b.querySelector('#stPrev');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,640,190);const dark=hexLum(S.color)>.82;x.drawImage(brushPreview(brushById(id),640,190,{paper:true,paperColor:dark?'#2a2e36':'#f4f1ea',color:S.color}),0,0);};
  const set=(k,v)=>{if(custom){custom[k]=v;store.set('strata.custom',customBrushes);}else{brushMods[id]={...(brushMods[id]||{}),[k]:v};store.set('strata.brushmods',brushMods);const rs=b.querySelector('#stReset');if(rs)rs.disabled=false;}invalidateBrushes();Object.assign(br,{[k]:v});cancelAnimationFrame(set.raf);set.raf=requestAnimationFrame(draw);};
  b.querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>{const k=i.dataset.k,fd=F.flatMap(f=>f[1]).find(f=>f[0]===k);const v=+i.value;i.nextElementSibling.textContent=fd[5](v);set(k,v);});
  b.querySelectorAll('select[data-k]').forEach(i=>i.onchange=()=>set(i.dataset.k,i.value||null));
  const nm=b.querySelector('#stName');if(nm)nm.onchange=()=>{const v=nm.value.trim();if(v)set('name',v);};
  b.onclick=e=>{const tg=e.target.closest('[data-tog] button');if(tg){const k=tg.parentNode.dataset.tog;set(k,tg.dataset.v==='1');tg.parentNode.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===tg));return;}
   const t=e.target.closest('button');if(!t)return;
   if(t.id==='stBack'){S.brushCat=brushById(id).cat;openSheet('brushes');}
   else if(t.id==='stUse'){S.brushFor[sizeKey()]=id;closeSheet();toast(brushById(id).name+' selected');}
   else if(t.id==='stReset'){delete brushMods[id];store.set('strata.brushmods',brushMods);invalidateBrushes();buildSheet();toast('Brush reset');}
   else if(t.id==='stDup'){const src=brushById(id);const nb={...src,id:'u'+uid(),name:src.name+' copy',cat:'mine'};customBrushes.push(nb);store.set('strata.custom',customBrushes);invalidateBrushes();S.studioId=nb.id;S.brushFor[sizeKey()]=nb.id;buildSheet();toast('Saved to My brushes');}
   else if(t.id==='stDel'){customBrushes=customBrushes.filter(x=>x.id!==id);store.set('strata.custom',customBrushes);invalidateBrushes();for(const k in S.brushFor)if(S.brushFor[k]===id)S.brushFor[k]='studio';S.brushCat='mine';openSheet('brushes');toast('Brush deleted');}};
  draw();},
 shape(b){const kinds=[['rect','Rectangle'],['round','Rounded'],['ellipse','Ellipse'],['line','Line'],['tri','Triangle'],['star','Star'],['hex','Hexagon']];
  b.innerHTML=`<div class="sh"><h3>Shapes</h3></div><div class="btns">${kinds.map(([k,n])=>`<button class="btn ${S.shape.kind===k?'on':''}" data-k="${k}">${n}</button>`).join('')}</div>

 fill(b){b.innerHTML=`<div class="sh"><h3>Fill</h3></div><div class="row"><label for="slTol">Threshold</label><input id="slTol" type="range" min="0" max="100" value="${S.fill.tol}"><output>${S.fill.tol}%</output></div>

 color(b){b.innerHTML=`<div class="sh"><h3>Colour</h3><div class="sw" style="background:${S.color};width:44px;height:30px" id="cNow"></div></div>
  <div class="sv" id="sv"><canvas width="300" height="180"></canvas><div class="ring" id="svRing"></div></div>
  <div class="hue" id="hue"><div class="ring" id="hueRing"></div></div>

  const sv=b.querySelector('#sv'),hue=b.querySelector('#hue');
  const drag=(el,fn)=>{let on=false;el.addEventListener('pointerdown',e=>{on=true;setColor.dragging=true;try{el.setPointerCapture(e.pointerId);}catch(_){}fn(e);});el.addEventListener('pointermove',e=>on&&fn(e));const off=()=>{if(on){on=false;setColor.dragging=false;pushRecent(S.color);drawSwatches();}};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);};
  drag(sv,e=>{const r=sv.getBoundingClientRect();const s=clamp((e.clientX-r.left)/r.width,0,1),v=clamp(1-(e.clientY-r.top)/r.height,0,1);S.hsv=[S.hsv[0],s,v];applyHsv();});

  b.querySelector('#hexIn').addEventListener('change',e=>{let v=e.target.value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)){if(v.length===4)v='#'+v.slice(1).split('').map(c=>c+c).join('');setColor(v,true);drawSwatches();}else{toast('Use a hex code like #1F2A44');e.target.value=S.color.toUpperCase();}});

 layers(b){const d=S.doc;const L=d.active;

    el.innerHTML=`<div class="lmain" data-sel="${l.id}" role="button" tabindex="0"><img class="lthumb" alt="" src="${t.toDataURL()}"><div class="lname"><b>${esc(l.name)}</b><span>${l.text?'Editable text · ':''}${BLENDS.find(x=>x[0]===l.blend)[1]} · ${Math.round(l.opacity*100)}%${l.alphaLock?' · Alpha lock':''}</span></div><button class="eye ${l.visible?'':'off'}" data-eye="${l.id}" aria-label="Show or hide">${svg(l.visible?'eye':'eyeoff')}</button></div>`+
     (on?`<div class="lopts"><div class="row"><label for="lOp">Opacity</label><input id="lOp" type="range" min="0" max="100" value="${Math.round(l.opacity*100)}"><output>${Math.round(l.opacity*100)}%</output></div>

  const bgEl=document.createElement('div');bgEl.className='layer';bgEl.innerHTML=`<div class="lmain"><label class="lthumb" style="background:${d.bg};position:relative;overflow:hidden"><input type="color" id="bgCol" value="${d.bg}" style="opacity:0;position:absolute;inset:0;width:100%;height:100%"></label><div class="lname"><b>Background colour</b><span>${d.bgVisible?'Shown · tap the swatch to change':'Hidden · exports with a transparent background'}</span></div><button class="eye ${d.bgVisible?'':'off'}" data-eye="bg" aria-label="Show or hide background">${svg(d.bgVisible?'eye':'eyeoff')}</button></div>`;list.appendChild(bgEl);

async function canvasBlob(c,type,q){return await new Promise(r=>c.toBlob(r,type,q));}
async function exportImage(kind){

  if(kind==='jpg'){const j=mk(W,H),x=j.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.drawImage(c,0,0);return showExport(j,'image/jpeg','jpg');}

async function showExport(c,type,ext,title){

  const url=c.toDataURL(type,.92);const blob=await canvasBlob(c,type,.92);
  modal(`<div class="mbox"><h3>${title?esc(title)+' mockup':'Export'}</h3><img class="mimg" src="${url}" alt="Exported image preview"><p>On iPhone: press and hold the image, then tap <b>Save to Photos</b> or <b>Share</b>. ${c.width} × ${c.height} px.</p>
   <div class="mact"><button class="pill" data-close>Close</button><button class="pill" id="xDl">Download</button><button class="pill accent" id="xSh">Share…</button></div></div>`);
  $('#xSh').onclick=async()=>{try{const f=new File([blob],name,{type});if(navigator.canShare&&!navigator.canShare({files:[f]}))throw 0;await navigator.share({files:[f],title:name});}catch(e){if(e&&e.name==='AbortError')return;toast('Sharing isn’t available here. Press and hold the image instead.');}};
  $('#xDl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloading '+name);}catch(e){toast('Download is blocked here. Press and hold the image instead.');}};
}

 req(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('projects',mode),st=t.objectStore('projects');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
 async all(){await this.open();if(!this.ok)return[...this.mem.values()];try{return await this.req('readonly',s=>s.getAll());}catch(e){this.ok=false;return[...this.mem.values()];}},
 async get(id){await this.open();if(!this.ok)return this.mem.get(id);return await this.req('readonly',s=>s.get(id));},
 async put(o){await this.open();if(!this.ok){this.mem.set(o.id,o);return;}try{await this.req('readwrite',s=>s.put(o));}catch(e){this.ok=false;this.mem.set(o.id,o);noticeStorage();}},
 async del(id){await this.open();if(!this.ok){this.mem.delete(id);return;}await this.req('readwrite',s=>s.delete(id));},
};
function noticeStorage(){const n=$('#gnotice');n.hidden=false;n.textContent='This browser window isn’t keeping saved data, so canvases last only until you close it. Export anything you want to keep.';}
let saveTimer=null,saving=Promise.resolve();
function scheduleSave(){if(!S.doc)return;S.doc.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1800);}
async function saveNow(){clearTimeout(saveTimer);if(!S.doc||!S.doc.dirty)return saving;const d=S.doc;d.dirty=false;
  saving=saving.then(async()=>{try{const layers=[];for(const L of d.layers)layers.push({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,alphaLock:L.alphaLock,text:L.text?{...L.text}:null,blob:await canvasBlob(L.canvas,'image/png')});
    const k=Math.min(1,420/Math.max(W,H)),t=mk(W*k,H*k);composite(t,{bg:true,live:false});
    await DB.put({id:d.id,name:d.name,w:W,h:H,bg:d.bg,bgVisible:d.bgVisible,palette:d.palette,updated:Date.now(),created:d.created||Date.now(),thumb:await canvasBlob(t,'image/png'),layers,activeIndex:d.layers.indexOf(d.active)});}catch(e){console.warn('save failed',e);}});
  return saving;}
async function loadBitmap(blob){try{return await createImageBitmap(blob);}catch(e){return await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=URL.createObjectURL(blob);});}}
function setupDoc(w,h){W=w;H=h;comp=mk(W,H);cctx=comp.getContext('2d',{willReadFrequently:true});strokeC=mk(W,H);sctx=strokeC.getContext('2d');texC=mk(W,H);tctx=texC.getContext('2d');scratch=mk(W,H);xctx=scratch.getContext('2d');Hst.stack=[];Hst.idx=0;}
async function openProject(rec){
  setupDoc(rec.w,rec.h);const d={id:rec.id,name:rec.name,bg:rec.bg,bgVisible:rec.bgVisible,palette:rec.palette||[],created:rec.created,layers:[],active:null};
  for(const l of rec.layers){const L=newLayer(l.name);Object.assign(L,{visible:l.visible,opacity:l.opacity,blend:l.blend,alphaLock:l.alphaLock,text:l.text||null});if(l.blob){const bm=await loadBitmap(l.blob);if(bm)L.ctx.drawImage(bm,0,0);}d.layers.push(L);}
  if(!d.layers.length)d.layers.push(newLayer('Layer 1'));d.active=d.layers[clamp(rec.activeIndex|0,0,d.layers.length-1)];
  S.doc=d;showEditor();
}
function newProject(name,w,h,bg){setupDoc(w,h);const L=newLayer('Layer 1');S.doc={id:uid(),name,bg:bg||'#ffffff',bgVisible:true,palette:[],created:Date.now(),layers:[L],active:L,dirty:true};showEditor();saveNow();}

/* ============ screens ============ */
function showEditor(){const m=Math.max(W,H);S.size.brush=Math.max(3,Math.round(m*.018));S.size.eraser=Math.round(m*.045);S.size.smudge=Math.round(m*.045);$('#gallery').hidden=true;$('#editor').hidden=false;$('#docName').textContent=S.doc.name;$('#bColor').style.background=S.color;
  resize();fitView();setTool('brush');updateUndo();updateSliders();toast('Pinch to zoom · two-finger tap to undo');}
let thumbURLs=[];
async function showGallery(){S.doc=null;$('#editor').hidden=true;$('#gallery').hidden=false;
  const list=(await DB.all()).sort((a,b)=>b.updated-a.updated);if(!DB.ok)noticeStorage();
  thumbURLs.forEach(u=>URL.revokeObjectURL(u));thumbURLs=[];const g=$('#grid');
  g.innerHTML=`<button class="card newcard" data-new><span>+</span><b>New canvas</b></button>`+list.map(p=>{const u=p.thumb?URL.createObjectURL(p.thumb):'';thumbURLs.push(u);const dt=new Date(p.updated);return`<div class="card" data-id="${p.id}"><button class="thumb" data-open aria-label="Open ${esc(p.name)}">${u?`<img src="${u}" alt="">`:''}</button><div class="meta"><div><div class="nm">${esc(p.name)}</div><div class="dm">${p.w} × ${p.h} · ${dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div></div><button class="more" data-more aria-label="More options">•••</button></div></div>`;}).join('')
   ;
  g.onclick=async e=>{if(e.target.closest('[data-new]')){$('#newBtn').click();return;}const card=e.target.closest('.card');if(!card)return;const id=card.dataset.id;
    if(e.target.closest('[data-open]')){const rec=await DB.get(id);if(rec)openProject(rec);return;}
    if(e.target.closest('[data-more]')){const ex=card.querySelector('.acts');if(ex){ex.remove();return;}const a=document.createElement('div');a.className='acts';a.innerHTML=`<button class="pill" data-r>Rename</button><button class="pill" data-d>Duplicate</button><button class="pill danger" data-x>Delete</button>`;card.appendChild(a);return;}
    if(e.target.closest('[data-r]')){const rec=await DB.get(id);renameModal(rec.name,async v=>{rec.name=v;await DB.put(rec);showGallery();});}
    if(e.target.closest('[data-d]')){const rec=await DB.get(id);await DB.put({...rec,id:uid(),name:rec.name+' copy',updated:Date.now()});showGallery();}
    if(e.target.closest('[data-x]')){const a=card.querySelector('.acts');a.innerHTML=`<span class="empty" style="align-self:center">Delete for good?</span><button class="pill" data-no>Keep</button><button class="pill danger" data-yes>Delete</button>`;}
    if(e.target.closest('[data-no]')){card.querySelector('.acts').remove();}
    if(e.target.closest('[data-yes]')){await DB.del(id);showGallery();}};
}
$('#newBtn').onclick=()=>{let sel=PRESETS[0];
  modal(`<div class="mbox"><h3>New canvas</h3><div class="presets" id="pr">${PRESETS.map((p,i)=>`<button class="preset ${i===0?'on':''}" data-i="${i}"><b>${p.n}</b><span>${p.w} × ${p.h} px</span></button>`).join('')}</div>
   <div class="sec" style="margin:4px 0 0">Custom size (px)</div><div class="wh"><input id="nw" type="number" inputmode="numeric" min="64" max="4096" value="${sel.w}" aria-label="Width"><span>×</span><input id="nh" type="number" inputmode="numeric" min="64" max="4096" value="${sel.h}" aria-label="Height"></div>
   <div class="wh"><input id="nn" type="text" value="Untitled brand" maxlength="60" aria-label="Name"><label class="pill" style="position:relative;white-space:nowrap">Background <input type="color" id="nbg" value="#ffffff" style="width:22px;height:18px;padding:0;border:0;vertical-align:middle;background:none"></label></div>
   <p id="nwarn"></p><div class="mact"><button class="pill" data-close>Cancel</button><button class="pill accent" id="nGo">Create</button></div></div>`);
  $('#pr').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;sel=PRESETS[+b.dataset.i];document.querySelectorAll('#pr .preset').forEach(x=>x.classList.toggle('on',x===b));$('#nw').value=sel.w;$('#nh').value=sel.h;};
  $('#nGo').onclick=()=>{let w=Math.round(+$('#nw').value),h=Math.round(+$('#nh').value);if(!(w>=64&&h>=64&&w<=4096&&h<=4096)){$('#nwarn').textContent='Width and height must each be between 64 and 4096 px.';return;}
    if(w*h>12e6){$('#nwarn').textContent='That’s too big for iPhone memory. Keep it under 12 megapixels (for example 3000 × 4000).';return;}
    const nm=$('#nn').value.trim()||'Untitled',bg=$('#nbg').value;closeModal();newProject(nm,w,h,bg);};};

/* ============ sample ============ */
async function seedSample(){
  setupDoc(1600,1600);const d={id:uid(),name:'Sample · Fernbrook mark',bg:'#efe8da',bgVisible:true,palette:['#1f4d3a','#efe8da','#c9783b','#2a2a26'],created:Date.now(),layers:[],active:null};S.doc=d;
  const em=newLayer('Emblem'),c=em.ctx;c.fillStyle='#1f4d3a';c.beginPath();c.arc(800,610,400,0,TAU);c.fill();c.strokeStyle='#efe8da';c.lineWidth=12;c.beginPath();c.arc(800,610,350,0,TAU);c.stroke();
  c.fillStyle='#efe8da';c.beginPath();c.moveTo(800,330);c.bezierCurveTo(1010,470,1010,740,800,900);c.bezierCurveTo(590,740,590,470,800,330);c.fill();
  c.strokeStyle='#1f4d3a';c.lineWidth=14;c.lineCap='round';c.beginPath();c.moveTo(800,380);c.lineTo(800,870);c.stroke();for(let i=0;i<4;i++){const y=470+i*95;c.beginPath();c.moveTo(800,y+40);c.quadraticCurveTo(860,y+10,905-i*12,y-25+i*6);c.stroke();c.beginPath();c.moveTo(800,y+40);c.quadraticCurveTo(740,y+10,695+i*12,y-25+i*6);c.stroke();}
  const sun=newLayer('Accent');sun.ctx.fillStyle='#c9783b';sun.ctx.beginPath();sun.ctx.arc(1090,330,70,0,TAU);sun.ctx.fill();sun.opacity=.95;
  const wm=newLayer('Wordmark');wm.text={str:'FERNBROOK',font:'Bebas Neue',size:250,weight:400,color:'#1f4d3a',x:800,y:1070,align:'center',tracking:22,lh:1};
  const tg=newLayer('Tagline');tg.text={str:'COFFEE ROASTERS · EST. 2026',font:'Montserrat',size:50,weight:700,color:'#c9783b',x:800,y:1360,align:'center',tracking:12,lh:1};
  await Promise.all([loadFont(wm.text),loadFont(tg.text)]);renderText(wm);renderText(tg);
  d.layers=[em,sun,wm,tg];d.active=wm;d.dirty=true;await saveNow();S.doc=null;
}

/* ============ keyboard ============ */
document.addEventListener('keydown',e=>{if(!S.doc||e.target.closest('input,textarea,select'))return;const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  const map={b:'brush',s:'smudge',e:'eraser',g:'fill',u:'shape',t:'text',v:'move',i:'picker'};if(map[k]){setTool(map[k]);return;}
  if(k==='['||k===']'){const t=sizeKey();S.size[t]=clamp(Math.round(S.size[t]*(k===']'?1.15:1/1.15)),1,maxSize());updateSliders();bubble(S.size[t]+' px');clearTimeout(bubble.t);bubble.t=setTimeout(()=>$('#bubble').hidden=true,700);}
  if(k==='0'){fitView();}});

/* ============ toast ============ */
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1500);}

/* ============ boot ============ */
new ResizeObserver(()=>{if(S.doc){const ow=view.width/dpr,oh=view.height/dpr;resize();if(ow&&oh){S.view.tx+=(stage.clientWidth-ow)/2;S.view.ty+=(stage.clientHeight-oh)/2;}requestRender();}}).observe(stage);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});
window.addEventListener('pagehide',()=>saveNow());
(async()=>{
  await DB.open();
  let list=[];try{list=await DB.all();}catch(e){}
  if(!list.length&&!store.get('strata.seeded',false)){await seedSample();store.set('strata.seeded',true);}
  showGallery();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&document.documentElement.dataset.standalone==='1'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
